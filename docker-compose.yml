version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: todo-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  todo-app:
    build: .
    container_name: todo-app
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  mongo_data: